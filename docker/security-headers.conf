# Security headers for the static SPA.
#
# Included in every location that serves files. nginx drops server-level
# add_header directives inside any location that declares its own
# add_header, so these live in one include instead of the server block.
#
# /api/ responses get their headers from helmet in Express instead.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Same value helmet already sends on /api/ responses.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy. Scripts may only come from this site (the inline
# theme script lives in /theme-init.js), so an injected <script> or inline
# handler cannot run. Styles allow inline (React style props) and Google
# Fonts; images/media/connect allow https because chat images and the API
# can live on other hosts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' blob: data: https:; frame-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
