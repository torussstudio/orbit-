# Security headers for the static SPA.
#
# Included in every location that serves files. nginx drops server-level
# add_header directives inside any location that declares its own
# add_header, so these live in one include instead of the server block.
#
# /api/ responses get their headers from helmet in Express instead.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Same value helmet already sends on /api/ responses.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
