server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    # Also compress responses proxied from the API (JSON lists).
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xhtml+xml
        image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Live updates (Server-Sent Events). Same upstream and headers as the
    # /api/ block above; proxy_pass has no URI part in either block, so Node
    # receives /api/events/stream unchanged. Exact match, so it wins over
    # the /api/ prefix block for this one path only.
    # Differences from /api/: keep-alive to Node instead of "upgrade", no
    # buffering / cache / gzip (events must reach the browser at once), and
    # 1 h timeouts (Node sends a heartbeat every 25 s).
    location = /api/events/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Vite build output: content-hashed file names (e.g. index-COcVoZwD.js)
    # never change, so they can be cached for a year. Files in sub folders
    # such as /assets/images/ are not hashed and fall through to "location /".
    # (Quoted because nginx would read the "{8}" braces as a block.)
    location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|mjs|css|woff2?|ttf|png|jpe?g|gif|svg|webp|avif)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app shell and the service worker must always be revalidated so a
    # deploy is picked up on the next load.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
