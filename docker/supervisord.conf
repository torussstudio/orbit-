[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:orbit-backend]
directory=/app/server
command=node /app/docker/start-backend.js
autostart=true
autorestart=true
startsecs=5
priority=10
environment=NODE_ENV="production",PORT="4000"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:orbit-nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
