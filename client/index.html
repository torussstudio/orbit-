<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="theme-color" content="#ffffff" />
<script>
  (function () {
    try {
      var c = localStorage.getItem('orbit_theme_last') || 'light';
      var dark = c === 'dark' || (c === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      var r = document.documentElement;
      r.dataset.theme = dark ? 'dark' : 'light';
      r.style.colorScheme = dark ? 'dark' : 'light';
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#17191c');
    } catch (e) {}
  })();
</script>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="assets/images/orbit-logo-transparent.png">
  <!-- Install as an app (PWA): desktop Chrome/Edge, Android, iPhone "Add to Home Screen". -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orbit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Fonts: same Google Fonts stylesheet that index.css used to @import.
       Loaded here so it downloads in parallel with the app's CSS. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <title>Orbit</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
